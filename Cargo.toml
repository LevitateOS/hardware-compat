[package]
name = "hardware-compat"
version = "0.1.0"
edition = "2021"
description = "Hardware compatibility verification for LevitateOS"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
colored = "2.0"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.4"
regex = "1.10"

[dev-dependencies]
tempfile = "3.24.0"
